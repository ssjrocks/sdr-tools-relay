# Inside the ssjrocks.com server block (443), next to /api/reports/.
    location /api/sdr-relay/ {
        proxy_pass http://127.0.0.1:8793/api/sdr-relay/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
        proxy_read_timeout 20s;
    }
